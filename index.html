<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PFC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 검정·흰색·빨강 세 가지 색. 비스듬히 잘린 빨간 판 위에 굵은 글자, HUD는 좁고 단단한 글꼴. 위에 화면, 아래에 탭 5개. */
:root{
  --bk:#0a0a0c; --bk2:#141417; --line:#2c2c33;
  --ink:#f3f1ec; --dim:#84848f;
  --red:#e0162b; --red2:#8f0c1a; --gold:#ffc21a; --mint:#7be04a; --sky:#b9bcc6;
  --card:#17171b; --dark:#050506;
  --display:"Anton","Black Han Sans","Noto Sans KR",sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:#000;color:var(--ink);font-family:var(--body);font-weight:500;font-size:15px;touch-action:manipulation;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
input{-webkit-user-select:text;user-select:text;font-family:inherit}
button{font-family:inherit;font-weight:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#app{position:relative;height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:var(--bk)}
#app::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 0 62%,var(--red) 62% 63.2%,transparent 63.2% 66%,rgba(224,22,43,.16) 66% 100%),
  radial-gradient(#ffffff0d 1px,transparent 1.4px) 0 0/9px 9px}
#view{position:relative;flex:1;overflow-y:auto;padding:18px 16px 26px;display:flex;flex-direction:column;gap:16px}
#tabs{position:relative;display:grid;grid-template-columns:repeat(5,1fr);background:var(--dark);border-top:2px solid var(--ink)}
#tabs button{position:relative;padding:15px 0 14px;font-size:13px;font-weight:900;letter-spacing:.5px;color:var(--dim)}
#tabs button.on{color:#fff;background:var(--red);clip-path:polygon(10% 0,100% 0,90% 100%,0 100%)}
#tabs button:focus-visible,.btn:focus-visible,.tile:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1{font-family:var(--display);font-weight:400;font-size:40px;line-height:1;margin:0;font-style:italic;letter-spacing:.5px;color:#fff;text-wrap:balance;transform:rotate(-2deg);transform-origin:left;text-shadow:3px 3px 0 var(--red)}
h2{align-self:flex-start;font-family:var(--display);font-weight:400;font-size:18px;line-height:1;margin:0;padding:6px 16px 6px 10px;background:var(--ink);color:#000;font-style:italic;letter-spacing:.5px;clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%)}
p{margin:0;line-height:1.55}
.dim{color:var(--dim)} .small{font-size:12px} .num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:.5px}
.card{position:relative;background:var(--card);border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:6px 6px 0 #000}
.row{display:flex;align-items:center;gap:10px} .row.wrap{flex-wrap:wrap} .grow{flex:1;min-width:0}
.between{justify-content:space-between}
.btn{white-space:nowrap;flex:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;background:#26262c;color:var(--ink);font-size:14px;font-weight:900;letter-spacing:.5px;border:1px solid #45454f;box-shadow:3px 3px 0 #000;transition:transform .05s}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.btn.grow{flex:1}
.btn.gold{background:var(--ink);color:#000;border-color:#fff}
.btn.red{background:var(--red);color:#fff;border-color:#ff5b6b}
.btn.mint{background:#000;color:#fff;border:2px solid var(--ink)}
.btn.ghost{background:transparent;color:var(--sky);border:1px solid var(--line);box-shadow:none}
.btn.big{font-family:var(--display);font-weight:400;font-style:italic;font-size:26px;letter-spacing:1.5px;padding:16px;width:100%;clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);box-shadow:none}
.btn.sm{padding:7px 11px;font-size:12px}
.btn:disabled{opacity:.3;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:#000;border:1px solid var(--line);font-size:12px;font-weight:700;white-space:nowrap}
.cn{display:inline-block;width:9px;height:9px;background:var(--gold);transform:rotate(45deg)}
.bar{position:relative;height:10px;background:#000;border:1px solid #55555f;overflow:hidden;transform:skewX(-18deg)}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);transition:width .12s}
.bar>i.gh{background:var(--red);transition:width .5s .25s}
.bar.xp>i{background:var(--sky)} .bar.ga>i{background:var(--gold)}
.bar.hp>i.fl{background:linear-gradient(180deg,#b8ff7a,var(--mint))} .bar.hp>i.fl.low{background:var(--gold)}
.bar.st>i{background:var(--red)}
input.txt{width:100%;padding:12px 14px;border:1px solid var(--line);border-bottom:3px solid var(--red);background:#000;color:var(--ink);font-size:17px;font-weight:700;border-radius:0}
input[type=range]{accent-color:var(--red);width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-weight:700;font-size:13px;box-shadow:4px 4px 0 #000}
.tile:active{border-color:var(--red)}
.tile.on{border-color:var(--red);background:linear-gradient(160deg,var(--red2),var(--card) 55%)}
.tile .emo{font-family:var(--display);font-style:italic;font-size:34px;line-height:1}
.tile svg.ic{width:52px;height:52px}
.tile:disabled{opacity:.3}
.note{background:#000;border:1px solid var(--line);border-left:4px solid var(--gold);padding:10px 12px;font-size:12px;line-height:1.55;color:#d8d2c2}
/* 캐릭터 */
.ft{position:relative;width:6em;height:9.5em;font-size:16px;flex:none}
.ft svg{width:100%;height:100%;overflow:visible;display:block}
.ft.flip svg{transform:scaleX(-1)}
.ft.flip .unflip{transform:scaleX(-1);transform-origin:62px 40px}
.ft .bob{animation:bob 1.1s ease-in-out infinite}
.ft .all,.ft .la,.ft .ra{transition:transform .07s ease-out}
.ft .all{transform-origin:60px 150px}
@keyframes bob{50%{transform:translateY(2.5px)}}
.ft.jab .la{transform:translate(24px,4px)}
.ft.jab .all{transform:translateX(5px)}
.ft.heavy .ra{transform:translate(52px,-8px)} .ft.heavy .all{transform:translateX(10px) rotate(9deg)}
.ft.sp .ra{transform:translate(54px,-12px)} .ft.sp .la{transform:translate(20px,-6px)} .ft.sp .all{transform:translateX(14px) rotate(12deg)}
.ft.guard .la{transform:translate(-16px,-12px)} .ft.guard .ra{transform:translate(12px,-10px)} .ft.guard .all{transform:translateX(-3px)}
.ft.charge .ra{transform:translate(-14px,8px)} .ft.charge .all{transform:rotate(-7deg)} .ft.charge{filter:drop-shadow(0 0 .5em var(--red))}
.ft.dodge .all{transform:translate(-22px,6px) rotate(-14deg);opacity:.45}
.ft.stun .bob{animation:stun .25s linear infinite}
@keyframes stun{25%{transform:translateX(-3px) rotate(-3deg)}75%{transform:translateX(3px) rotate(3deg)}}
.ft.hit .all{transform:translateX(-9px) rotate(-6deg)} .ft.hit{filter:brightness(2.4) saturate(0)}
.ft.dead .bob{animation:none} .ft.dead .all{transform:translate(-8px,34px) rotate(-82deg)} .ft.dead{filter:grayscale(1) brightness(.4)}
/* 오버레이 */
.ov{position:absolute;inset:0;z-index:20;background:var(--bk);display:flex;flex-direction:column;overflow:hidden}
.ov::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 0 70%,rgba(224,22,43,.14) 70% 100%),radial-gradient(#ffffff0d 1px,transparent 1.4px) 0 0/9px 9px}
.ov .pad{position:relative;padding:18px 16px;display:flex;flex-direction:column;gap:16px;overflow-y:auto;flex:1}
.modal{position:absolute;inset:0;z-index:40;background:#000e;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .card{width:100%;max-width:360px;border:2px solid var(--ink);box-shadow:8px 8px 0 var(--red)}
#toast{position:absolute;left:0;right:0;top:12px;z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:var(--ink);color:#000;padding:8px 18px;font-size:13px;font-weight:900;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);animation:pop .18s}
@keyframes pop{from{transform:translateX(-30px);opacity:0}}
/* 전투 */
#hud{position:relative;display:grid;grid-template-columns:1fr 54px 1fr;gap:6px;align-items:start;padding:10px 10px 6px;background:linear-gradient(180deg,#000,transparent)}
#hud .who{display:flex;flex-direction:column;gap:3px;min-width:0}
#hud .who.r{align-items:flex-end} #hud .who.r .bar{transform:skewX(18deg) scaleX(-1)}
#hud .bar{width:100%;height:14px;border:2px solid var(--ink)} #hud .bar.ga{height:6px;border-width:1px}
#hud .nm{font-size:12px;font-weight:900;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#hud #bt{font-family:var(--display);font-size:38px;line-height:.9;text-align:center;color:#fff;text-shadow:2px 2px 0 var(--red)}
#arena{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;align-items:end;gap:4px;padding:4px 6px 18px;overflow:hidden;
  background:radial-gradient(60% 50% at 50% 38%,#ffffff12,transparent 70%),linear-gradient(180deg,transparent 0 78%,#1c1c21 78% 79%,#101013 79% 100%)}
#arena::after{content:"";position:absolute;left:0;right:0;bottom:0;height:21%;pointer-events:none;background:repeating-linear-gradient(100deg,transparent 0 34px,#ffffff08 34px 36px)}
.side{position:relative;z-index:1;display:grid;gap:8px 2px;justify-items:center;align-items:end}
.side.two{grid-template-columns:1fr 1fr}
.fcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px}
.fcard .ft{font-size:inherit}
.fcard .mini{width:5.4em;min-width:52px;display:flex;flex-direction:column;gap:2px}
.fcard .nm{font-size:10px;font-weight:900;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcard .bar{height:6px}
.fcard.me .nm{color:var(--gold)}
.fcard.tg::after{content:"";position:absolute;top:-10px;left:50%;margin-left:-7px;border:7px solid transparent;border-top:9px solid var(--red);animation:tgb .5s steps(2) infinite}
@keyframes tgb{50%{transform:translateY(3px)}}
.pop{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-family:var(--display);font-style:italic;font-size:26px;color:#fff;text-shadow:2px 2px 0 #000,-1px -1px 0 #000;white-space:nowrap;pointer-events:none;animation:rise .75s forwards;z-index:5}
.pop.big{font-size:34px} .pop.tag{font-size:15px;top:12%;background:var(--red);color:#fff;padding:2px 8px;text-shadow:none}
@keyframes rise{0%{transform:translate(-50%,0) scale(1.7)}18%{transform:translate(-50%,-4px) scale(1)}100%{transform:translate(-50%,-44px);opacity:0}}
#ann{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;pointer-events:none}
#ann b{font-family:var(--display);font-weight:400;font-style:italic;font-size:84px;line-height:1;color:#fff;padding:6px 40px;background:var(--red);clip-path:polygon(24px 0,100% 0,calc(100% - 24px) 100%,0 100%);animation:ann .85s forwards}
@keyframes ann{0%{transform:translateX(-120%) skewX(-12deg)}18%,78%{transform:none}100%{transform:translateX(120%) skewX(-12deg);opacity:0}}
#ctl{position:relative;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-areas:"gd dg sp" "jab jab hv";gap:7px;padding:9px 9px 11px;background:#000;border-top:2px solid var(--ink)}
#ctl .btn{height:60px;font-family:var(--display);font-weight:400;font-style:italic;font-size:21px;letter-spacing:1px;flex-direction:column;gap:1px;box-shadow:none;border-width:2px}
#ctl .btn small{font-family:var(--body);font-style:normal;font-weight:700;font-size:10px;letter-spacing:0;opacity:.7}
#ctl .btn:active{transform:scale(.96)}
#bg{grid-area:gd} #bd{grid-area:dg} #bs{grid-area:sp} #bj{grid-area:jab} #bh{grid-area:hv}
#ctl #bj{height:74px;font-size:30px;background:var(--red);color:#fff;border-color:#ff5b6b}
#ctl #bh{height:74px;background:var(--ink);color:#000;border-color:#fff}
#ctl #bs{background:#000;border-color:var(--gold);color:var(--gold)}
#ctl #bs:not(:disabled){background:var(--gold);color:#000;animation:ready .5s steps(2) infinite}
@keyframes ready{50%{filter:brightness(1.35)}}
#ctl .btn.cdn{filter:brightness(.4)}
.shake{animation:shk .22s}
@keyframes shk{20%{transform:translate(-5px,3px)}60%{transform:translate(5px,-3px)}}
.mash{width:196px;height:196px;border-radius:50%;background:#000;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;align-self:center;box-shadow:0 0 0 8px var(--red2),8px 10px 0 8px #000}
.mash svg{width:110px;height:110px}
.mash:active{transform:scale(.93);border-color:var(--red)}
.rank{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);padding:5px 12px 5px 6px}
.rank.top{border-left:5px solid var(--red)}
.rank.me{border-color:var(--gold)}
.rank .no{width:34px;text-align:center;font-family:var(--display);font-style:italic;font-size:24px}
.rank .ft{font-size:5px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#000;border:1px solid var(--line);padding:3px;gap:3px}
.seg button{padding:9px 4px;font-size:13px;font-weight:900;color:var(--dim)}
.seg button.on{background:var(--ink);color:#000;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.stat{display:grid;grid-template-columns:54px 34px 1fr auto;gap:8px;align-items:center}
.stat .num{font-size:22px;text-align:right}
.hero{position:relative;display:flex;gap:12px;align-items:flex-end;padding:14px;background:linear-gradient(115deg,var(--red) 0 34%,var(--card) 34.4%);border:1px solid var(--line);box-shadow:6px 6px 0 #000}
.hero .nm{font-family:var(--display);font-style:italic;font-size:28px;line-height:1.05;word-break:break-all}
canvas#crop{border-radius:50%;border:3px solid var(--ink);touch-action:none;align-self:center;background:#000}
kbd{font-family:var(--display);background:var(--ink);color:#000;padding:0 6px;font-size:13px}

/* --- 정리된 화면: 장식을 걷어내고 강조는 빨강 한 가지만 --- */
#app::before{background:linear-gradient(180deg,#1a0d10,transparent 240px)}
.ov::before{display:none}
#view,.ov .pad{gap:18px;padding:20px 18px 28px}
h1{font-size:30px;transform:none;text-shadow:none;font-style:normal;letter-spacing:0}
h2{background:none;color:var(--dim);clip-path:none;padding:0 0 0 10px;border-left:3px solid var(--red);font-style:normal;font-size:14px;letter-spacing:1px}
.card,.tile,.rank,.note{box-shadow:none;border-radius:8px}
.card{border-color:var(--line);gap:14px;padding:16px}
.modal .card{box-shadow:none;border:1px solid #45454f}
.btn{box-shadow:none;border-radius:8px;border-color:transparent;background:#24242a}
.btn:active{transform:scale(.97);box-shadow:none}
.btn.gold{background:var(--ink);color:#000}
.btn.red{background:var(--red);border-color:transparent}
.btn.mint{background:#24242a;border:0;color:var(--ink)}
.btn.ghost{border:1px solid var(--line);color:var(--sky)}
.btn.big{clip-path:none;font-style:normal;font-size:22px;letter-spacing:1px;padding:15px}
.tile.on{background:var(--card);border-color:var(--red)}
.tile .emo{font-style:normal;font-size:28px}
.pill{border-radius:6px;border-color:transparent;background:#1f1f24}
.hero{background:var(--card);box-shadow:none;border-radius:8px;align-items:center}
.hero .nm{font-style:normal;font-size:24px}
#tabs{border-top:1px solid var(--line)}
#tabs button{font-weight:700}
#tabs button.on{background:none;clip-path:none;color:#fff;box-shadow:inset 0 3px 0 var(--red)}
.seg{border-radius:8px} .seg button{border-radius:6px} .seg button.on{clip-path:none}
#toast div{clip-path:none;border-radius:8px}
.rank .no{font-style:normal}
.bar{transform:none;border-radius:4px;border-color:#3a3a42} .bar>i{border-radius:0}
#hud .who.r .bar{transform:scaleX(-1)}
#hud .bar{border:1px solid #6a6a74} #hud #bt{text-shadow:none;font-size:34px}
#arena{background:radial-gradient(60% 50% at 50% 40%,#ffffff0d,transparent 70%),linear-gradient(180deg,transparent 0 78%,#1c1c21 78% 79%,#101013 79% 100%)}
#arena::after{display:none}
#ctl{border-top:1px solid var(--line);gap:8px;padding:10px 10px 14px}
#ctl .btn{font-style:normal;border:0;border-radius:10px;font-size:18px;background:#24242a;color:var(--ink)}
#ctl .btn small{display:none}
#ctl #bj{font-size:26px;background:var(--red)} #ctl #bh{background:#3a3a42;color:#fff}
#ctl #bs{background:#24242a;color:var(--dim)} #ctl #bs:not(:disabled){background:var(--gold);color:#000}
#ann b{font-size:64px;clip-path:none;border-radius:6px}
.pop{font-style:normal} .pop.tag{border-radius:4px}
.mash{box-shadow:none;border-color:var(--line)}
#arena.g3{display:block;padding:0;background:#08080a}
#arena.g3 canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#lbl{position:absolute;inset:0;overflow:hidden}
.fcard.c3{position:absolute;justify-content:flex-start;font-size:10px}
.fcard.c3 .mini{width:64px;transform:translateY(-22px)}
.fcard.c3.me .mini{opacity:.85}
.fcard.c3.tg::after{top:-34px}
.fcard.c3 .pop{top:6%}
#ctl{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding:10px 12px 16px}
#joy{position:relative;width:118px;height:118px;border-radius:50%;background:#141418;border:2px solid var(--line);touch-action:none;flex:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:#55555f;pointer-events:none}
#atk{display:grid;grid-template-columns:78px 78px;gap:8px;flex:none}
#atk .btn{grid-area:auto}
#ctl #atk .btn,#ctl #bj,#ctl #bh{height:58px;font-size:18px}
#ctl #bj{font-size:24px}
#ctl #bd{width:58px;height:58px;border-radius:50%;font-size:15px;flex:none}
#ghead{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:#000;border-bottom:1px solid var(--line)}
#ghead b{font-size:18px}
#gstage{position:relative;flex:1;min-height:0;background:#0b0b0d;cursor:pointer;touch-action:manipulation}
#gstage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#gfx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#gfx .pop{top:28%} #gfx .pop.tag{top:16%}
#ghint{position:absolute;left:0;right:0;bottom:10px;margin:0;text-align:center;font-size:12px;color:var(--dim);pointer-events:none}
.gflat{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.gflat svg{width:150px;height:150px} .gflat.hop svg{animation:hop .2s}
@keyframes hop{50%{transform:scale(.88)}}
#gpanel{position:relative;display:flex;flex-direction:column;gap:10px;padding:12px 16px 18px;background:#000;border-top:1px solid var(--line)}
#gw button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px}
#gw small{font-size:10px;font-weight:500;opacity:.7} #gw button.lock{opacity:.35}
#gpanel .btn.big{padding:13px}
#tabs{grid-template-columns:repeat(6,1fr)} #tabs button{font-size:12px;padding:14px 0 13px}
.skb{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:6px;background:#1f1f24;border:1px solid var(--gc);font-size:12px}
.skb b{color:var(--gc)}
.gtag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;font-weight:900;color:#000;background:var(--gc,#9aa0a8);vertical-align:middle}
.skc{display:flex;flex-direction:column;gap:7px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gc);border-radius:8px;padding:12px 14px}
.skc p{margin:0}

const AUTHERR={"auth/email-already-in-use":"이미 있는 닉네임이에요","auth/credential-already-in-use":"이미 있는 닉네임이에요","auth/invalid-credential":"닉네임 또는 비밀번호가 틀렸어요",

/* ---------- 사진 얼굴 ---------- */
function pickPhoto(after){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="image/*";
  inp.onchange=()=>{const f=inp.files&&inp.files[0]; if(!f)return; const img=new Image(); const url=URL.createObjectURL(f);
    img.onload=()=>cropUI(img,after); img.onerror=()=>toast("사진을 열 수 없어요"); img.src=url};
  inp.click();
}
function cropUI(img,after){
  const L=$("#layer"), S=240; let z=1,ox=0,oy=0,drag=null;
  const m=document.createElement("div"); m.className="modal";
  m.innerHTML=`<div class="card"><h2>얼굴 맞추기</h2><p class="dim small">사진을 끌어서 얼굴을 원 안에 맞춰요.</p><canvas id="crop" width="${S}" height="${S}"></canvas>
   <input type="range" id="zoom" min="1" max="3" step="0.01" value="1"><div class="row"><button class="btn ghost grow" id="cx">취소</button><button class="btn red grow" id="cok">이 얼굴로</button></div></div>`;
  L.appendChild(m);
  const cv=m.querySelector("#crop"), cx=cv.getContext("2d"), base=S/Math.min(img.width,img.height);
  function draw(c,size){const s=base*z*(size/S), w=img.width*s, h=img.height*s; const mx=(w-size)/2,my=(h-size)/2;
    const x=clamp(ox*(size/S),-mx,mx), y=clamp(oy*(size/S),-my,my); c.fillStyle="#000"; c.fillRect(0,0,size,size); c.drawImage(img,(size-w)/2+x,(size-h)/2+y,w,h)}
  draw(cx,S);
  cv.onpointerdown=e=>{drag={x:e.clientX-ox,y:e.clientY-oy};cv.setPointerCapture(e.pointerId)};
  cv.onpointermove=e=>{if(drag){ox=e.clientX-drag.x;oy=e.clientY-drag.y;draw(cx,S)}};
  cv.onpointerup=()=>{drag=null};
  m.querySelector("#zoom").oninput=e=>{z=Number(e.target.value);draw(cx,S)};
  m.querySelector("#cx").onclick=()=>m.remove();
  m.querySelector("#cok").onclick=()=>{const o=document.createElement("canvas");o.width=o.height=96;draw(o.getContext("2d"),96);
    const d=okFace(o.toDataURL("image/jpeg",0.7)); if(!d){toast("사진을 만들지 못했어요");return} P.face=d; m.remove(); if(P.made)save(); after()};
}

function gymTap(){
  const g=GY; if(!g)return; const now=performance.now(); if(now<g.until){g.q=true;return}
  const k=g.k, t=k==="atk"?0:clamp(int(P.wt[k],0),0,3), dur=REPMS[k][t]; g.until=now+dur; GYM3.rep={t0:now,dur,n:++g.n,hit:0};

  const add=TIER.mult[t]; P.tp[k]=Math.round((P.tp[k]+add)*10)/10; gymPop("+"+add);

  return `잡기 ${r}% · `+(s.m==="mash"?`연타 ${Math.max(16,26-lv)}회`:s.m==="timing"?`초록 구간 ${Math.round(13+lv*1.4)}%`:`구간 ${Math.round(13+lv*1.4)}% + 연타 ${Math.round(Math.max(16,26-lv)*.7)}회`) }

let shopCat="gacha";
function rollSkill(min){ min=min||0; const tot=GRADE.slice(min).reduce((a,g)=>a+g[2],0); let r=Math.random()*tot,g=min; for(;g<3;g++){if(r<GRADE[g][2])break;r-=GRADE[g][2]} const ids=SKID.filter(k=>SK[k].g===g); return ids[rnd(ids.length)] }
function pull(n){
  const cost=n===10?900:100; if(P.coins<cost)return toast("코인이 모자라요 ("+cost+" 필요)");
  P.coins-=cost; const res=[]; for(let i=0;i<n;i++)res.push(rollSkill()); if(n===10&&res.every(id=>SK[id].g===0))res[9]=rollSkill(1);
  const out=res.map(id=>{const had=!!P.sk[id]; if(had)P.sk[id].cp=Math.min(999,P.sk[id].cp+1); else P.sk[id]={lv:1,cp:0}; return {id,nw:!had}});
  save(); renderShop();
  const m=document.createElement("div"); m.className="modal";
  m.innerHTML=`<div class="card"><h2>뽑기 결과</h2><div class="pulls ${n===1?"one":""}">${out.map((r,i)=>{const s=SK[r.id],g=GRADE[s.g];
     return `<div class="pc g${s.g}" style="--gc:${g[1]};animation-delay:${i*.09}s"><span class="gtag">${g[0]}</span><b>${s.n}</b><span class="small dim">${s.c}</span><span class="small" style="color:${r.nw?"var(--gold)":"var(--sky)"}">${r.nw?"NEW":"조각 +1"}</span></div>`}).join("")}</div>
   <div class="row"><button class="btn ghost grow" id="pok">확인</button><button class="btn red grow" id="pgo">스킬 창으로</button></div></div>`;
  $("#layer").appendChild(m); m.querySelector("#pok").onclick=()=>m.remove(); m.querySelector("#pgo").onclick=()=>{m.remove();tab="skill";render()};
}

    if(!create){ const s=await F.get(rr); if(!s.exists()||!s.val().players)throw new Error("none") }
    await F.onDisconnect(me).remove();
    off=F.onValue(rr,s=>{R=s.val()||{};build();subs.slice().forEach(f=>{try{f()}catch(e){console.error(e)}})});
    return api })();
}

/* ---------- 시작 ---------- */
let AU=null, FA=null, AUTH="";
async function enterAs(user,nick){
  uid=user.uid;
  const [ps,fs]=await Promise.all([F.get(F.ref(fdb,"players/"+uid)),F.get(F.ref(fdb,"faces/"+uid))]);
  cloud=true;
  if(ps.exists()){ P=clean(ps.val()); P.face=okFace(fs.val()); faceSaved=P.face }
  else { P=blank(); if(nick)P.nick=nick }
  if(user.isAnonymous){ if(!P.made){ await FA.signOut(AU); uid=null; cloud=false; AUTH="out"; booted=true; render(); return } AUTH="anon" } else AUTH="in";
  try{localStorage.setItem(lsKey(),JSON.stringify(P))}catch(e){}
  const on=F.ref(fdb,"online/"+uid);
  F.onValue(F.ref(fdb,".info/connected"),s=>{ if(s.val()===true){F.onDisconnect(on).remove().catch(()=>{});F.set(on,true).catch(()=>{})} });
  const relobby=()=>{ if(booted&&P&&P.made&&tab==="fight"&&!M.on)renderLobby() };
  F.onValue(F.ref(fdb,".info/serverTimeOffset"),s=>{srvOff=Number(s.val())||0});
  F.onValue(F.ref(fdb,"online"),s=>{ONLINE=s.val()||{};onlineN=Object.keys(ONLINE).length;relobby()},()=>{});
  F.onValue(F.ref(fdb,"lobby"),s=>{LOBBY=s.val()||{};relobby()},()=>{});
  F.onValue(F.ref(fdb,"ladder"),s=>{const v=s.val(); LADDER=v&&v.o?Object.values(v.o).filter(x=>typeof x==="string"):[]; rankAt=0;
    if(booted&&P&&P.made&&!M.on&&(tab==="rank"||tab==="home")&&!document.activeElement.matches("input"))render()},()=>{});
  room=true; startSocial(); booted=true; render();
}
async function boot(){
  render();
  try{
    let A,U,D;
    if(window.__FB){A=window.__FB.A;U=window.__FB.U;D=window.__FB.D}
    else{ const b="https://www.gstatic.com/firebasejs/"+FBV+"/";
      [A,U,D]=await Promise.race([Promise.all([import(b+"firebase-app.js"),import(b+"firebase-auth.js"),import(b+"firebase-database.js")]),new Promise((_,j)=>setTimeout(()=>j(new Error("timeout")),12000))]) }
    const app=A.initializeApp(FB_CFG); AU=U.getAuth(app); FA=U; F=D; fdb=D.getDatabase(app);
    const user=await new Promise(r=>{const off=U.onAuthStateChanged(AU,u=>{off();r(u)})});
    if(!user){ AUTH="out"; booted=true; render(); return }
    await enterAs(user,"");
  }catch(e){ console.warn(e); netErr=String(e&&(e.code||e.message)||e).slice(0,60); AUTH="local"; cloud=false;
    try{const l=JSON.parse(localStorage.getItem(LS)); if(l)P=clean(l)}catch(_){} booted=true; render() }
}
boot();
